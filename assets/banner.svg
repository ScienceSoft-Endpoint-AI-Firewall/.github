<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ScienceSoft Endpoint AI Firewall: a prompt typed on the device has the name, email and card number replaced before it is sent to the AI service">
  <title>ScienceSoft Endpoint AI Firewall</title>
  <!-- Hero banner. One 8 s loop: the prompt is typed on the device, the agent
       detects three personal values (they turn orange), the shield masks them,
       and the AI service receives the same prompt with the values replaced.
       Synthetic data only. The static frame (reduced motion) is the end state. -->
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .pii{animation:detect 8s ease-in-out infinite both}
    .p2{animation-delay:.35s}.p3{animation-delay:.7s}
    .out{animation:arrive 8s ease-out infinite both}
    .o2{animation-delay:.25s}.o3{animation-delay:.5s}
    .flow{animation:flow 1s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 8s ease-out infinite both}
    .scan{animation:scan 8s ease-in-out infinite both}
    .dot{transform-box:fill-box;transform-origin:center;animation:pop 8s ease-out infinite both}
    .d2{animation-delay:.1s}.d3{animation-delay:.2s}
    @keyframes detect{0%,14%{fill:#FFFFFF}20%,92%{fill:#FF9A08}98%,100%{fill:#FFFFFF}}
    @keyframes arrive{0%,46%{opacity:0;transform:translateX(-12px)}54%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0;transform:translateX(0)}}
    @keyframes flow{to{stroke-dashoffset:-20}}
    @keyframes pulse{0%,30%{opacity:0;transform:scale(.8)}34%{opacity:.55}50%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes scan{0%,28%{opacity:0;transform:translateY(0)}30%{opacity:.9}40%{opacity:.9;transform:translateY(17px)}43%,100%{opacity:0;transform:translateY(17px)}}
    @keyframes pop{0%,40%{opacity:0;transform:scale(0)}44%{opacity:1;transform:scale(1.35)}47%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.scan,.pulse{opacity:0}}
  </style>
  <defs><clipPath id="sh"><path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z"/></clipPath></defs>

  <rect width="1280" height="400" rx="20" fill="#005EB8"/>

  <!-- Header -->
  <g transform="translate(60,44) scale(4)">
    <path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="7.7" y1="9.3" x2="16.3" y2="9.3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7.7" y1="12.3" x2="11.3" y2="12.3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="13.15" cy="12.3" r="0.7" fill="#FF9A08"/><circle cx="14.75" cy="12.3" r="0.7" fill="#FF9A08"/><circle cx="16.35" cy="12.3" r="0.7" fill="#FF9A08"/>
    <line x1="8.6" y1="15.2" x2="13.2" y2="15.2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text class="sans" x="172" y="98" font-size="40" font-weight="700" fill="#FFFFFF">ScienceSoft Endpoint AI Firewall</text>
  <text class="sans" x="172" y="136" font-size="20" fill="#FFFFFF" fill-opacity="0.85">Masks personal and confidential data in AI prompts — before it leaves the device.</text>
  <text class="sans" x="1220" y="64" font-size="15" fill="#FFFFFF" fill-opacity="0.7" text-anchor="end">by ScienceSoft</text>

  <!-- Left: what was typed -->
  <rect x="60" y="184" width="484" height="172" rx="14" fill="#003F7D" fill-opacity="0.55"/>
  <text class="sans" x="84" y="216" font-size="13" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.7">TYPED ON THE DEVICE</text>
  <text class="mono" font-size="18" fill="#FFFFFF">
    <tspan x="84" y="256">Write to <tspan class="pii" fill="#FF9A08">Jane Doe</tspan> about the claim.</tspan>
    <tspan x="84" y="290">Email: <tspan class="pii p2" fill="#FF9A08">jane.doe@example.com</tspan></tspan>
    <tspan x="84" y="324">Card: <tspan class="pii p3" fill="#FF9A08">4111 1111 1111 1111</tspan></tspan>
  </text>

  <!-- Connectors -->
  <line class="flow" x1="552" y1="270" x2="588" y2="270" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
  <line class="flow" x1="692" y1="270" x2="728" y2="270" stroke="#FF9A08" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Centre: the agent -->
  <circle class="pulse" cx="640" cy="270" r="62" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0"/>
  <g transform="translate(568,198) scale(6)">
    <path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round"/>
    <g clip-path="url(#sh)"><rect class="scan" x="3" y="3.2" width="18" height="0.45" fill="#FFFFFF" opacity="0"/></g>
    <line x1="7.7" y1="9.3" x2="16.3" y2="9.3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="7.7" y1="12.3" x2="11.3" y2="12.3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="x2" values="16.3;16.3;11.3;11.3;16.3" keyTimes="0;0.4;0.45;0.94;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <circle class="dot" cx="13.15" cy="12.3" r="0.6" fill="#FF9A08"/>
    <circle class="dot d2" cx="14.75" cy="12.3" r="0.6" fill="#FF9A08"/>
    <circle class="dot d3" cx="16.35" cy="12.3" r="0.6" fill="#FF9A08"/>
    <line x1="8.6" y1="15.2" x2="13.2" y2="15.2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <text class="sans" x="640" y="372" font-size="13" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">DETECT · MASK</text>

  <!-- Right: what the AI service receives -->
  <rect x="736" y="184" width="484" height="172" rx="14" fill="#003F7D" fill-opacity="0.55"/>
  <text class="sans" x="760" y="216" font-size="13" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.7">SENT TO THE AI SERVICE</text>
  <text class="mono out" x="760" y="256" font-size="18" fill="#FFFFFF">Write to <tspan fill="#FF9A08" font-weight="700">[PERSON]</tspan> about the claim.</text>
  <text class="mono out o2" x="760" y="290" font-size="18" fill="#FFFFFF">Email: <tspan fill="#FF9A08" font-weight="700">[EMAIL]</tspan></text>
  <text class="mono out o3" x="760" y="324" font-size="18" fill="#FFFFFF">Card: <tspan fill="#FF9A08" font-weight="700">[CREDIT_CARD]</tspan></text>
</svg>
