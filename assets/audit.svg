<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Audit: a tamper-evident chain of records">
  <title>Audit</title>
  <!-- Records join a hash chain one by one; a check seals the chain. Static frame: sealed chain. -->
  <style>
    .blk{animation:add 4.5s ease-out infinite both}
    .b2{animation-delay:.5s}.b3{animation-delay:1s}
    .lnk{animation:add 4.5s ease-out infinite both}
    .l1{animation-delay:.35s}.l2{animation-delay:.85s}
    .chk{stroke-dasharray:40;animation:seal 4.5s ease-out infinite both}
    @keyframes add{0%,5%{opacity:0;transform:translateY(-8px)}15%,85%{opacity:1;transform:translateY(0)}95%,100%{opacity:0;transform:translateY(0)}}
    @keyframes seal{0%,42%{stroke-dashoffset:40}55%,85%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:40}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="120" height="120" rx="26" fill="#005EB8"/>
  <g fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-width="3">
    <rect class="blk" x="14" y="34" width="24" height="28" rx="5"/>
    <rect class="blk b2" x="48" y="34" width="24" height="28" rx="5"/>
    <rect class="blk b3" x="82" y="34" width="24" height="28" rx="5"/>
  </g>
  <g stroke="#FF9A08" stroke-width="3" stroke-linecap="round">
    <line class="lnk l1" x1="39" y1="48" x2="47" y2="48"/>
    <line class="lnk l2" x1="73" y1="48" x2="81" y2="48"/>
  </g>
  <path class="chk" d="M46 86l9 9 19-19" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
