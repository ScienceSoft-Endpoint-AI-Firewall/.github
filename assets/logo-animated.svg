<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AI Firewall: a shield masking data">
  <title>ScienceSoft Endpoint AI Firewall</title>
  <!-- The mark: a shield holding three data lines. The middle line is raw data;
       a scan passes, it shortens, and the rest of it becomes orange dots (masked).
       The static frame (no animation) is the masked state. -->
  <style>
    .scan{animation:scan 4s ease-in-out infinite both}
    .dot{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-out infinite both}
    .d2{animation-delay:.12s}.d3{animation-delay:.24s}
    @keyframes scan{0%{opacity:0;transform:translateY(0)}5%{opacity:.9}28%{opacity:.9;transform:translateY(17px)}33%,100%{opacity:0;transform:translateY(17px)}}
    @keyframes pop{0%,30%{opacity:0;transform:scale(0)}38%{opacity:1;transform:scale(1.35)}44%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.scan{opacity:0}}
  </style>
  <defs><clipPath id="s"><path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z"/></clipPath></defs>
  <rect width="256" height="256" rx="56" fill="#005EB8"/>
  <g transform="translate(32,32) scale(8)">
    <path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-width="1.25" stroke-linejoin="round"/>
    <g clip-path="url(#s)"><rect class="scan" x="3" y="3.2" width="18" height="0.5" fill="#FFFFFF" opacity="0"/></g>
    <line x1="7.7" y1="9.3" x2="16.3" y2="9.3" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="7.7" y1="12.3" x2="11.3" y2="12.3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.4" stroke-linecap="round">
      <animate attributeName="x2" values="16.3;16.3;11.3;11.3;16.3" keyTimes="0;0.24;0.32;0.9;1" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle class="dot" cx="13.15" cy="12.3" r="0.66" fill="#FF9A08"/>
    <circle class="dot d2" cx="14.75" cy="12.3" r="0.66" fill="#FF9A08"/>
    <circle class="dot d3" cx="16.35" cy="12.3" r="0.66" fill="#FF9A08"/>
    <line x1="8.6" y1="15.2" x2="13.2" y2="15.2" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
