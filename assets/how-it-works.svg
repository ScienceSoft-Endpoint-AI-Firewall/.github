<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="How it works: the agent on the employee's computer detects personal data in a prompt and replaces it; the AI service receives the masked prompt; an enrolled device also sends the organisation what was detected and the masked message. The raw prompt and the detected values stay on the device.">
  <title>How AI Firewall works</title>
  <!-- Both outbound flows are drawn on purpose: the AI service gets the masked
       prompt, and an enrolled device ALSO sends the organisation's workspace a
       record (what was detected + the masked message). Showing only the vendor
       arrow would imply the employer sees nothing, which is not true. -->
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .flow{animation:flow 1.2s linear infinite}
    .step{transform-box:fill-box;transform-origin:center;animation:step 6s ease-in-out infinite both}
    .s2{animation-delay:1s}.s3{animation-delay:2s}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes step{0%,4%{transform:scale(1)}9%{transform:scale(1.3)}15%,100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFFFFF" fill-opacity="0.8"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF9A08"/></marker>
    <path id="pa" d="M280 270 L330 270"/>
    <path id="pc" d="M628 236 C 740 236, 760 185, 874 185"/>
    <path id="pd" d="M628 314 C 740 314, 760 362, 874 362"/>
  </defs>

  <rect width="1280" height="500" rx="20" fill="#0B2545"/>
  <text class="sans" x="60" y="62" font-size="26" font-weight="700" fill="#FFFFFF">How it works</text>

  <!-- The employee's computer -->
  <rect x="48" y="100" width="600" height="340" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text class="sans" x="72" y="132" font-size="13" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.7">EMPLOYEE'S COMPUTER</text>

  <!-- AI assistant -->
  <rect x="76" y="200" width="204" height="140" rx="12" fill="#12355F"/>
  <g transform="translate(152,222)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M4 2h40a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H18l-9 8v-8H4a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z"/>
    <line x1="10" y1="12" x2="36" y2="12"/><line x1="10" y1="20" x2="28" y2="20"/>
  </g>
  <text class="sans" x="178" y="294" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI assistant</text>
  <text class="sans" x="178" y="316" font-size="13" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">in a browser or an app</text>

  <path class="flow" d="M280 270 L330 270" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#aw)"/>

  <!-- The agent -->
  <rect x="336" y="160" width="292" height="220" rx="14" fill="#005EB8"/>
  <g transform="translate(352,174) scale(2.6)">
    <path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="7.7" y1="9.3" x2="16.3" y2="9.3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7.7" y1="12.3" x2="11.3" y2="12.3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="13.15" cy="12.3" r="0.75" fill="#FF9A08"/><circle cx="14.75" cy="12.3" r="0.75" fill="#FF9A08"/><circle cx="16.35" cy="12.3" r="0.75" fill="#FF9A08"/>
    <line x1="8.6" y1="15.2" x2="13.2" y2="15.2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text class="sans" x="422" y="200" font-size="18" font-weight="700" fill="#FFFFFF">AI Firewall agent</text>
  <text class="sans" x="422" y="222" font-size="13" fill="#FFFFFF" fill-opacity="0.75">runs on the device</text>

  <g class="sans" font-size="15" fill="#FFFFFF">
    <circle class="step" cx="368" cy="268" r="12" fill="#FF9A08"/><text x="368" y="273" font-size="13" font-weight="700" fill="#0B2545" text-anchor="middle">1</text>
    <text x="392" y="273">Detect personal data</text>
    <circle class="step s2" cx="368" cy="304" r="12" fill="#FF9A08"/><text x="368" y="309" font-size="13" font-weight="700" fill="#0B2545" text-anchor="middle">2</text>
    <text x="392" y="309">Replace it in the prompt</text>
    <circle class="step s3" cx="368" cy="340" r="12" fill="#FF9A08"/><text x="368" y="345" font-size="13" font-weight="700" fill="#0B2545" text-anchor="middle">3</text>
    <text x="392" y="345">Record what was found</text>
  </g>

  <g transform="translate(76,404)" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.8" stroke-linejoin="round">
    <rect x="0" y="7" width="14" height="11" rx="2"/><path d="M3 7V4.5a4 4 0 0 1 8 0V7"/>
  </g>
  <text class="sans" x="100" y="420" font-size="14" fill="#FFFFFF" fill-opacity="0.85">Stays here: the raw prompt and the detected values</text>

  <!-- Outbound: AI service -->
  <path class="flow" d="M628 236 C 740 236, 760 185, 874 185" stroke="#FF9A08" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ao)"/>
  <text class="sans" x="672" y="176" font-size="14" font-weight="600" fill="#FFFFFF">Masked prompt</text>
  <rect x="880" y="130" width="352" height="110" rx="12" fill="#12355F"/>
  <text class="sans" x="904" y="174" font-size="18" font-weight="700" fill="#FFFFFF">AI service</text>
  <text class="sans" x="904" y="200" font-size="13" fill="#FFFFFF" fill-opacity="0.7">ChatGPT, Claude, Gemini and others</text>
  <text class="sans" x="904" y="222" font-size="13" fill="#FF9A08">receives [PERSON], [EMAIL], [CREDIT_CARD]</text>

  <!-- Outbound: organisation -->
  <path class="flow" d="M628 314 C 740 314, 760 362, 874 362" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#aw)"/>
  <text class="sans" x="672" y="392" font-size="14" font-weight="600" fill="#FFFFFF">What was detected +</text>
  <text class="sans" x="672" y="411" font-size="14" font-weight="600" fill="#FFFFFF">the masked message</text>
  <rect x="880" y="300" width="352" height="124" rx="12" fill="#12355F"/>
  <text class="sans" x="904" y="342" font-size="18" font-weight="700" fill="#FFFFFF">Your organisation's workspace</text>
  <text class="sans" x="904" y="368" font-size="13" fill="#FFFFFF" fill-opacity="0.7">Tamper-evident audit trail · policy · fleet console</text>
  <text class="sans" x="904" y="394" font-size="13" fill="#FFFFFF" fill-opacity="0.7">From devices enrolled by IT</text>

  <!-- Packets -->
  <circle class="pkt" r="5" fill="#FFFFFF"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle>
  <circle class="pkt" r="5" fill="#FF9A08"><animateMotion dur="2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#pc"/></animateMotion></circle>
  <circle class="pkt" r="5" fill="#FFFFFF"><animateMotion dur="2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#pd"/></animateMotion></circle>

  <text class="sans" x="60" y="476" font-size="13" fill="#FFFFFF" fill-opacity="0.65">Detected values are never collected. On a device enrolled in an organisation, its workspace receives what was detected and the message with those values already replaced.</text>
</svg>
